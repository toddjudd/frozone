name: terraform check

# Static validation only — no AWS credentials, no OIDC, no secrets, so this
# is safe to run on pull requests from forks.
#
# It deliberately does not run `terraform plan`. State is local to the
# machine that runs apply, so a plan here would start from empty state and
# confidently report that it needs to create every resource. A remote
# backend is the prerequisite for a meaningful plan in CI; see README.
#
# Deliberately does NOT use `pull_request_target` (see README for why).
on:
  push:
    branches: ["**"]
    paths: ["terraform/**", ".github/workflows/terraform-check.yml"]
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform-check.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs: a mutable tag like @v4 can be repointed at
      # malicious code by a compromised maintainer or a stolen PAT.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: terraform fmt
        working-directory: terraform
        run: terraform fmt -check -diff

      # -backend=false: never needs credentials or remote state to validate.
      - name: terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: terraform
        run: terraform validate
