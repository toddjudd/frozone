name: terraform plan

# Runs on every push, including from forks — but a plan is read-only and
# this workflow never has access to secrets when triggered from a fork,
# so it's safe by construction. Deliberately does NOT use
# `pull_request_target` anywhere in this repo (see README for why).
on:
  push:
    branches: ["**"]
    paths: ["terraform/**"]
  pull_request:
    paths: ["terraform/**"]

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      # fmt/init/validate run before AWS auth so they still give a signal on
      # fork PRs, where `id-token: write` can't be granted and the credentials
      # step always fails. This ordering holds only while the backend is local;
      # uncommenting the S3 backend in main.tf makes `init` need credentials.
      - name: terraform fmt
        working-directory: terraform
        run: terraform fmt -check -diff

      - name: terraform init
        working-directory: terraform
        run: terraform init

      - name: terraform validate
        working-directory: terraform
        run: terraform validate

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_bucket_name: ${{ vars.BUCKET_NAME }}
          TF_VAR_github_repo: ${{ github.repository }}

      # Only the human-readable render is uploaded. The binary plan file and
      # `terraform show -json` both contain prior state in cleartext, including
      # aws_iam_access_key.backup's secret; plain `terraform show` redacts it.
      - name: render plan
        working-directory: terraform
        run: terraform show -no-color tfplan > plan.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: terraform/plan.txt
          retention-days: 7
